version: 2
updates:
  # Keep the GitHub Actions pinned in .github/workflows/* patched. Grouped into a single
  # weekly PR instead of one per action. (No application dependency manifests are tracked;
  # the only pyproject.toml is inside a vendored demo skill, deliberately not monitored.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
