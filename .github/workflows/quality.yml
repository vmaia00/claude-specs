name: quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly link rot sweep, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint (workflow lint)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  manifests:
    name: plugin manifests + frontmatter
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: node scripts/validate-plugins.mjs

  markdownlint:
    name: markdownlint (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Collect changed markdown
        id: changed
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.md' > changed-md.txt || true
          echo "count=$(grep -c . changed-md.txt || true)" >> "$GITHUB_OUTPUT"
          echo "Changed markdown files:"; cat changed-md.txt
      - name: Lint changed files
        if: steps.changed.outputs.count != '0'
        run: |
          mapfile -t files < changed-md.txt
          npx -y markdownlint-cli2@0.22.1 "${files[@]}"

  links:
    name: lychee (link check)
    # Link rot is a maintenance signal, not a per-PR gate: run on a weekly schedule and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 8 './**/*.md'
          fail: true
